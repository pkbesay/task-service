# Профиль standalone (SPRING_PROFILES_ACTIVE=standalone): API работает само по себе, без PostgreSQL.
# Нужен для запуска одного контейнера (docker run -p 8080:8080) и проверки API локально без Docker.
# Данные лежат во встроенной БД H2 в памяти и пропадают при остановке приложения.
spring.datasource.url=jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# При старте добавляем пару демо-задач, чтобы GET /tasks сразу что-то показывал
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:demo-data.sql
spring.jpa.defer-datasource-initialization=true
