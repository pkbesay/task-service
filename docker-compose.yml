# Связка API -> PostgreSQL для сервиса задач.
name: task-service

services:
  # База данных PostgreSQL 16
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    volumes:
      # Данные БД лежат в именованном volume и переживают docker compose down / up
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Порт 5432 наружу не публикуется: API ходит в БД по внутренней сети app-network.
    # Для подключения из pgAdmin/DBeaver можно раскомментировать (если 5432 на хосте свободен):
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API сервиса задач (.NET 9)
  api:
    build:
      context: ./TaskApi
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Настройки подключения к БД: хост = имя сервиса db в этом файле
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: postgres
      DB_PASSWORD: "1234"
    ports:
      - "8080:8080"
    depends_on:
      db:
        # API стартует только после того, как healthcheck db станет healthy
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
