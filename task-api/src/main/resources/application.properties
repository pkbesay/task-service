spring.application.name=task-api
server.port=8080

# Подключение к PostgreSQL: значения приходят из переменных окружения (environment в docker-compose.yml).
# DB_HOST=db - имя сервиса PostgreSQL в docker-compose, Docker DNS сам находит IP контейнера по этому имени.
# После двоеточия - значения по умолчанию для запуска без Docker.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
# Если db ещё не принимает подключения, пул повторяет попытки до 60 секунд, а не падает сразу
spring.datasource.hikari.initialization-fail-timeout=60000

# Таблица tasks создаётся автоматически, если её нет. Существующие данные из volume db_data не трогаются.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQL-запросы Hibernate в логах: видно, что API работает с PostgreSQL
logging.level.org.hibernate.SQL=debug
